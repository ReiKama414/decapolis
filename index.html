<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decapolis｜十城</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f16; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; }
  .ui { position: fixed; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.55); user-select: none; }
  #hud { left: 20px; top: 16px; }
  #hud h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: 0.01em; }
  #hud h1 small { font-size: 15px; font-weight: 400; opacity: 0.8; margin-left: 8px; }
  #hud .cap { font-size: 12.5px; opacity: 0.85; margin-top: 2px; }
  #hud .ctl { margin-top: 10px; display: flex; gap: 16px; align-items: center; font-size: 13px; }
  .t { background: none; border: 0; padding: 0 0 1px; color: inherit; font: inherit; text-shadow: inherit; cursor: pointer; opacity: 0.7; border-bottom: 1px solid transparent; }
  .t:hover { opacity: 1; }
  .t.on { opacity: 1; border-bottom-color: currentColor; }
  #days { display: none; gap: 5px; }
  #days button { width: 12px; height: 12px; padding: 0; border: 1px solid rgba(255,255,255,0.5); cursor: pointer; }
  #days button.on { border: 2px solid #fff; }
  #cities { left: 20px; right: 20px; bottom: 14px; display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; font-size: 13.5px; white-space: nowrap; }
  #cities::-webkit-scrollbar { display: none; }
  #veil { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #err { position: fixed; left: 20px; top: 110px; color: #ffb4a8; font-size: 12px; }
  #links {
    right: 18px; top: 16px; display: flex; gap: 14px; align-items: center;
    font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase;
  }
  #links a {
    color: rgba(255,255,255,0.72); text-decoration: none; opacity: 0.85;
    border-bottom: 1px solid transparent; padding-bottom: 1px;
  }
  #links a:hover { color: #fff; opacity: 1; border-bottom-color: rgba(255,255,255,0.55); }
  #links .sep { opacity: 0.35; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="veil"></div>
<div id="hud" class="ui">
  <h1 id="cityName"></h1>
  <div class="cap" id="cityCap"></div>
  <div class="ctl">
    <button class="t" id="btnNight">Night</button>
    <button class="t" id="btnRotate">Rotate</button>
    <span id="days"></span>
  </div>
</div>
<nav id="links" class="ui" aria-label="Author links">
  <a href="https://github.com/ReiKama414/decapolis" target="_blank" rel="noopener noreferrer">GitHub</a>
  <span class="sep" aria-hidden="true">·</span>
  <a href="https://reikama414.vercel.app/" target="_blank" rel="noopener noreferrer">Website</a>
</nav>
<nav id="cities" class="ui"></nav>
<div id="err" class="ui"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// City scripts are classic scripts loaded on demand, so the page also works from file://
window.T = { THREE, OrbitControls, EffectComposer, RenderPass, UnrealBloomPass, OutputPass, mergeGeometries };
const s = document.createElement('script');
s.src = 'js/core.js';
document.head.appendChild(s);
</script>
</body>
</html>
